<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="line-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .glow-node {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 12, 12;
        animation: dash 20s linear infinite;
      }
      .flow-line-fast {
        stroke-dasharray: 8, 8;
        animation: dash 10s linear infinite reverse;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: url(#title-grad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-pill {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #cbd5e1;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.7; }
        100% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -240; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Animated Grid Lines & Nodes (Background) -->
  <g stroke-linecap="round">
    <!-- Connecting flow paths -->
    <path d="M 100,80 Q 300,30 600,80 T 1100,80" stroke="url(#line-grad-1)" stroke-width="2" fill="none" class="flow-line" />
    <path d="M 50,280 Q 400,330 700,270 T 1150,290" stroke="url(#line-grad-2)" stroke-width="2" fill="none" class="flow-line-fast" />
    <path d="M 150,180 C 350,100 850,260 1050,180" stroke="url(#line-grad-1)" stroke-width="1.5" fill="none" opacity="0.4" />

    <!-- Animated Data Nodes -->
    <circle cx="100" cy="80" r="6" fill="#38bdf8" filter="url(#glow)" class="glow-node" />
    <circle cx="600" cy="80" r="8" fill="#818cf8" filter="url(#glow)" class="glow-node" />
    <circle cx="1100" cy="80" r="6" fill="#c084fc" filter="url(#glow)" class="glow-node" />

    <circle cx="200" cy="290" r="7" fill="#6366f1" filter="url(#glow)" class="glow-node" />
    <circle cx="700" cy="270" r="9" fill="#a855f7" filter="url(#glow)" class="glow-node" />
    <circle cx="1050" cy="180" r="5" fill="#38bdf8" filter="url(#glow)" class="glow-node" />
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Icon / Tag -->
    <rect x="520" y="45" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="600" y="66" class="badge-pill" text-anchor="middle">⚡ DATA ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="150" class="title-text" filter="url(#glow)">Awesome Data Integration</text>

    <!-- Subtitle -->
    <text x="600" y="195" class="subtitle-text">Curated SaaS Platforms &amp; Open-Source Tools for ELT, ETL, CDC &amp; iPaaS</text>

    <!-- Category Pills -->
    <g transform="translate(230, 240)">
      <rect x="0" y="0" width="140" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
      <text x="70" y="23" class="badge-pill" text-anchor="middle" fill="#38bdf8">🔄 Managed ELT</text>

      <rect x="160" y="0" width="140" height="36" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
      <text x="230" y="23" class="badge-pill" text-anchor="middle" fill="#818cf8">⚡ Real-time CDC</text>

      <rect x="320" y="0" width="140" height="36" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" opacity="0.9"/>
      <text x="390" y="23" class="badge-pill" text-anchor="middle" fill="#c084fc">🔌 Enterprise iPaaS</text>

      <rect x="480" y="0" width="140" height="36" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.5" opacity="0.9"/>
      <text x="550" y="23" class="badge-pill" text-anchor="middle" fill="#4ade80">🌐 Open Source</text>
    </g>
  </g>
</svg>
